name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          actual="$(go run . version)"
          expected="updev ${TAG}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::release version mismatch: expected '${expected}', got '${actual}'"
            exit 1
          fi

      - name: Check release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="docs/release-notes/${TAG}.md"
          if [[ ! -f "${notes_file}" ]]; then
            echo "::error file=${notes_file}::Release notes are required for ${TAG}."
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=docs/release-notes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/checksums.txt
