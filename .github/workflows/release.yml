name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          name="updev_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${name}"
          go build -trimpath -ldflags="-s -w" -o "dist/${name}/updev${{ matrix.ext }}" .
          cp README.md "dist/${name}/README.md"
          cp docs/RELEASE.md "dist/${name}/RELEASE.md"
          if [[ "${GOOS}" == "windows" ]]; then
            (cd dist && zip -r "${name}.zip" "${name}")
          else
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) -print0 |
            sort -z |
            xargs -0 shasum -a 256 > "checksums-${{ matrix.goos }}-${{ matrix.goarch }}.txt"
          mkdir -p upload
          find . -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' -o -name 'checksums-*.txt' \) \
            -exec cp {} upload/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: updev-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/upload/*
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "${GITHUB_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist
          find dist -mindepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete

      - name: Combine checksums
        run: |
          set -euo pipefail
          cat dist/checksums-*.txt | sort -k2 > dist/checksums.txt
          rm dist/checksums-*.txt

      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Prepare release notes
        run: |
          set -euo pipefail
          notes_file="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -f "${notes_file}" ]]; then
            echo "::error file=${notes_file}::Release notes are required for ${GITHUB_REF_NAME}."
            exit 1
          fi
          cp "${notes_file}" dist/release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_assets=(dist/*.tar.gz dist/*.zip dist/checksums.txt)
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "updev ${GITHUB_REF_NAME}" \
              --notes-file dist/release-notes.md
            gh release upload "${GITHUB_REF_NAME}" "${release_assets[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${release_assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "updev ${GITHUB_REF_NAME}" \
              --notes-file dist/release-notes.md
          fi
