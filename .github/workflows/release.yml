name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          name="updev_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${name}"
          go build -trimpath -ldflags="-s -w" -o "dist/${name}/updev${{ matrix.ext }}" .
          cp README.md "dist/${name}/README.md"
          cp docs/RELEASE.md "dist/${name}/RELEASE.md"
          if [[ "${GOOS}" == "windows" ]]; then
            (cd dist && zip -r "${name}.zip" "${name}")
          else
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) -print0 |
            sort -z |
            xargs -0 shasum -a 256 > "checksums-${{ matrix.goos }}-${{ matrix.goarch }}.txt"
          mkdir -p upload
          find . -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' -o -name 'checksums-*.txt' \) \
            -exec cp {} upload/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: updev-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/upload/*
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums
        run: |
          set -euo pipefail
          cat dist/checksums-*.txt | sort -k2 > dist/checksums.txt
          rm dist/checksums-*.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "updev ${GITHUB_REF_NAME}" \
            --notes "Public preview release. macOS/Homebrew/mise is the supported preview scope; Linux and Windows binaries are experimental."
