[tools]
go = "1.26.4"
goreleaser = "2.16.0"
shellcheck = "0.11.0"

[tasks.test]
description = "Run updev Go tests with cache and wall time"
run = "GOCACHE=${GOCACHE:-${TMPDIR:-/tmp}/updev-gocache} /usr/bin/time -p go test ./..."

[tasks.test-fresh]
description = "Run updev Go tests without cache and show wall time"
run = "GOCACHE=${GOCACHE:-${TMPDIR:-/tmp}/updev-gocache} /usr/bin/time -p go test -count=1 ./..."

[tasks.test-verbose]
description = "Run updev Go tests verbosely without cache"
run = "GOCACHE=${GOCACHE:-${TMPDIR:-/tmp}/updev-gocache} /usr/bin/time -p go test -count=1 -v ./..."

[tasks.test-e2e]
description = "Run the full updev built-binary PTY route suite for release/TTY UX gates"
run = "GOCACHE=${GOCACHE:-${TMPDIR:-/tmp}/updev-gocache} /usr/bin/time -p go test -tags=e2e -count=1 ./test/e2e"

[tasks.test-e2e-fast]
description = "Run the fast dashboard-only PTY smoke for local TTY UX checks"
run = "GOCACHE=${GOCACHE:-${TMPDIR:-/tmp}/updev-gocache} /usr/bin/time -p go test -tags=e2e -count=1 ./test/e2e -run 'TestInteractivePTYSmoke/dashboard optimized routes'"

[tasks.test-e2e-smoke]
description = "Alias for test-e2e-fast"
depends = ["test-e2e-fast"]

[tasks.vet]
description = "Run updev Go vet"
run = "GOCACHE=${GOCACHE:-${TMPDIR:-/tmp}/updev-gocache} go vet ./..."

[tasks.fmt-check]
description = "Check Go formatting"
run = "scripts/check-go-format.sh"

[tasks.staticcheck]
description = "Run bug-class Staticcheck analyzers"
run = "scripts/check-staticcheck.sh"

[tasks.golangci-lint]
description = "Run curated golangci-lint checks"
run = "scripts/check-golangci-lint.sh"

[tasks.vuln]
description = "Run Go vulnerability audit"
run = "scripts/check-govulncheck.sh"

[tasks.supply-chain]
description = "Review public-repo GitHub Actions and release security posture"
run = "scripts/check-github-actions-security.sh"

[tasks.agent-quality]
description = "Run non-blocking deterministic agent-code-quality audit"
run = "scripts/check-agent-quality.sh"

[tasks.shellcheck]
description = "Run ShellCheck on updev scripts"
run = "shellcheck -S warning scripts/*.sh"

[tasks.lint]
description = "Run agent-friendly lint checks"
depends = ["fmt-check", "staticcheck", "golangci-lint", "shellcheck"]

[tasks.mod-verify]
description = "Verify updev Go modules"
run = "go mod verify"

[tasks.build]
description = "Build updev packages"
run = "GOCACHE=${GOCACHE:-${TMPDIR:-/tmp}/updev-gocache} go build ./..."

[tasks.goreleaser-check]
description = "Validate GoReleaser release configuration"
run = "goreleaser check"

[tasks.goreleaser-snapshot]
description = "Build local GoReleaser snapshot archives without publishing"
run = "GOCACHE=${GOCACHE:-${TMPDIR:-/tmp}/updev-gocache} goreleaser release --snapshot --clean"

[tasks.docs-check]
description = "Check high-value documentation source-of-truth mirrors"
run = "scripts/check-docs.sh"

[tasks.check]
description = "Run the standard updev local validation suite"
depends = ["lint", "test", "vet", "mod-verify", "build"]

[tasks.audit]
description = "Run slower release/scheduled audit checks"
depends = ["vuln", "supply-chain", "agent-quality"]
