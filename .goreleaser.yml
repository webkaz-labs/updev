# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: updev
dist: dist

builds:
  - id: updev
    main: .
    binary: updev
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: updev
    ids:
      - updev
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - README.md
      - src: docs/RELEASE.md
        dst: RELEASE.md

checksum:
  name_template: checksums.txt

release:
  github:
    owner: webkaz-labs
    name: updev
  mode: replace
  replace_existing_artifacts: true
  prerelease: auto
  make_latest: true
  name_template: "updev {{ .Tag }}"
